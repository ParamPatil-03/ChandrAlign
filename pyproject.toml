[project]
name = "chandralign"
version = "0.1.0"
description = "Multi-modal, Sun-angle and scale-invariant image correspondence for Chandrayaan-2 (SIH26166)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python>=4.8",
  "scikit-image>=0.22",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
learned = ["torch>=2.0", "vismatch>=1.3"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
