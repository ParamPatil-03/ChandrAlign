[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chandralign"
version = "0.1.0"
description = "Multi-modal, sun-angle and scale-invariant registration of Chandrayaan-2 images against LRO and SELENE references (SIH26166)"
readme = "README.md"
requires-python = ">=3.11"
# Every dependency is permissively licensed (PLAN.md 2.3).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",              # Part 2: robust estimation, Delaunay coverage
    "lxml",
    "pds4_tools",               # PDS4 labels (NASA PDS Small Bodies Node)
    "pvl",                      # PDS3 / ODL labels
    "pyshp",                    # PRADAN footprint shapefiles
    "shapely",                  # footprints and overlap
    "pyproj",                   # IAU 2015 Moon CRS and reprojection
    "opencv-python-headless>=4.8",   # CLAHE, MAGSAC, image ops (Apache-2.0)
    "scikit-image>=0.22",       # Part 2: phase correlation, sub-pixel
    "phasepack",                # phase congruency (PLAN.md P1-T13 pins THIS package: RIFT2 is built on it)
    "pyyaml>=6.0",              # configs/
    "requests",                 # data fetchers
    "phasepack",                # Part 1: phase congruency (PREP-02), imported at call time
]

[project.scripts]
chandralign = "chandralign.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
product = ["rasterio>=1.3", "matplotlib>=3.8", "jinja2>=3.1"]  # Part 3 exports + report
# vismatch is CAPPED, not just floored, and the cap is a LICENCE control
# (CHECK-10), not a compatibility one. zju3dv relicensed EfficientLoFTR and
# MatchAnything from Apache-2.0 to the Project Registration License -- not
# OSI-approved, registration required before organisational use -- on
# 2026-09-15. vismatch 1.3.2 was released 2026-08-17 and vendors the Apache-2.0
# code; a later release may vendor the relicensed code instead, and no model
# name would change. Re-audit (reports/licence_audit.json) before raising this;
# tests/test_part2_foundation.py fails if the installed version passes it.
learned = ["torch>=2.0", "vismatch>=1.3,<=1.3.2"]   # optional AI matchers (MATCH-03/04/05)
fast = ["pyfftw"]          # optional: ~2x faster phase congruency; phasepack falls back without it
# Added by the step that first needs them, so the base install stays light:
#   geo:      rasterio, spiceypy                   (Part 1, Phase 2)
#   prep:     spectral                            (Part 1, Phase 2)
#   product:  fastapi, uvicorn, jinja2, matplotlib (Part 3)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Quick run by default. Full run, including the multi-GB checksum checks:
#   pytest -m ""
addopts = "-q -m 'not slow and not network'"
markers = [
    "slow: reads whole multi-GB products (e.g. ISRO MD5 checks); run with -m slow or -m ''",
    "network: reaches a live service (ODE, DARTS); excluded by default so the suite passes offline",
]
