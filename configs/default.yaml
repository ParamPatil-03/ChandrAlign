# Pipeline defaults. Owner: Member A (configs/), seeded by Member B for Part 2.
# Every threshold here is a starting point to be TUNED BY THE ABLATION, not a
# tuned result. None of these numbers is a measurement.

# CHECK-10: while true, the licence gate refuses to construct any matcher on the
# benchmark_only list in regimes.yaml. Only scripts/bench_external.py sets false.
ship_mode: true

device: auto            # auto | cpu | cuda

matching:
  max_num_keypoints: 2048
  ratio_test: 0.80           # Lowe ratio; tightened adaptively on repetitive terrain
  ratio_test_repetitive: 0.70
  mutual_nn: true
  # MATCH-12 (docs/rotation_protocol.md): image-level rotation search, for pairs WITHOUT a
  # geometric prior (our registrations take rotation from the label corners).
  rotation_search: false
  rotation_step_deg: 30
  rotation_min_inliers: 40       # early exit: a 0-deg match this strong is kept unchanged
  # vismatch does its own RANSAC by default; we always disable it so our
  # estimator owns the inlier mask and the scale sanity check (P2-T01).
  skip_library_ransac: true

estimate:
  method: magsac             # magsac | ransac | usac_accurate
  reproj_threshold_px: 3.0
  # Raised from 10000 by MEASUREMENT (scripts/bench_estimators.py). At 90%
  # outliers a 4-point sample is all-inlier about once in 10^4 draws, so a
  # 10000 cap sat exactly on the edge: MAGSAC stopped early and succeeded on
  # 4 seeds in 10, where 100000 succeeds on all 10. It is a CAP, not a cost --
  # MAGSAC terminates adaptively, so runtime up to 80% outliers is unchanged
  # (0.0011 s at 30%, identical under both budgets) and only the 90% case
  # spends more (0.0033 s -> 0.021 s). Plain RANSAC does not share that
  # property: the same budget costs it 3.3 s per fit.
  max_iters: 100000
  confidence: 0.9999
  min_inliers: 12
  # Failure mode #13: reject a transform whose estimated scale disagrees with
  # the GSD ratio the instrument registry predicts.
  scale_tolerance: 0.25
  # Axis-ratio tolerance, used only when both products' pixel sizes are
  # VERIFIED by two agreeing sources. Tighter than scale_tolerance because a
  # correct transform's anisotropy is fixed by pixel geometry: IIRS is 26%
  # anisotropic, so a 25% tolerance could not tell it from a square pixel.
  anisotropy_tolerance: 0.10
  # How far outside its source range an UNVERIFIED expectation must be before
  # it may reject. Set from measurement, not taste: scripts/audit_gsd.py found
  # NAC labels off by up to 2.33x, so anything tighter would reject correct
  # transforms on the strength of a label already known to be wrong.
  unverified_scale_slack: 3.0

pipeline:                    # P2-T16: optional fine-stage steps (src/chandralign/pipeline.py)
  # Each switches one stage of pipeline.fine_stage, used by the registrations AND
  # by the control gates, so a gate always certifies the path that ran. All three
  # were built and unit-tested but called by no pipeline until 2026-09-23. They
  # are switched only by measurement on real data: the values below are set by
  # docs/pipeline_stages_protocol.md, not by preference.
  geometry_filter: true      # ALIGN-03: drop matches whose two ends are different terrain. ON by rule 5 (needs SLDEM; skipped without)
  parallax: false            # ALIGN-08: inliers under affine + DEM height x parallax. OFF globally; ON for TMC-2 -> TC only
                             # (register_tmc2_tc.py, with the TC DTM), the one pairing measured (docs/parallax_protocol.md am. 3)
  refill: false              # ALIGN-05: re-search empty cells locally (docs/refill_protocol.md)
  tps: true                  # ALIGN-02: TPS through the delivered points, ON by docs/tps_protocol.md (held-out -40% median)
  dense_refine: false        # Q6 (docs/illumination_fix_protocol.md): illumination-robust refinement of the model
  uniformity: true           # ALIGN-04: top-k per grid cell of the inliers (PS mandate). ON by v3: 9/9 windows
  subpixel: true             # PREC-01: per-point refinement of delivered points (PS mandate). ON by v3: 9/9, median 0.32 -> 0.07 px
  model_selection: true      # C-03 / I-01 (audit 2026-09-26): choose affine / parallax / TPS by check-point error on a
                             # refined, grid-stratified fit set, and REPORT that error (docs/refinement_geometry_protocol.md)

geometry:                    # the model_selection stage (estimate/selection.py)
  max_fit_points: 1000       # inliers sampled evenly over the grid, refined, used to fit and score the geometry
  cv_scheme: stratified      # each cell's points dealt into the folds. spatial_block (whole cells held out) read
                             # 2.2-5.3x the true error on the dev harness vs 1.2-3.6x (non-rigid); chosen on dev
  cv_folds: 5                # spatial-block CV for the TPS: whole grid cells per fold
  min_gain: 0.05             # a richer model must beat a simpler one's check-point RMS by this fraction
  irls_rounds: 2             # Huber reweighting rounds of the TPS fit
  tps_smoothing_grid: [0.1, 1.0, 10.0, 100.0, 1000.0]
  min_tps_points: 30

parallax:                    # ALIGN-08 stage options
  height_at: ref             # where h is sampled: the match's ground (reference) point; ref by docs/parallax_height_protocol.md
                             # (hilly median probe error 0.415 -> 0.352 px, 9/9 better). src = the earlier convention

similarity:                  # MATCH-07 MI alignment check (docs/mi_protocol.md)
  search_px: 3               # NMI searched over +-3 px around the delivered model
  flag_px: 1.0               # flag when NMI peaks this far from the model
  abstain: false             # rule R (docs/mi_abstain_protocol.md): abstain when the frame's halves disagree

uniformity:                  # ALIGN-04..07, the PS uniform-distribution mandate
  grid: 8                    # N x N cells
  top_k_per_cell: 6
  refill_empty_cells: true
  refill_ratio_test: 0.90    # looser threshold, local to the empty cell only
  delaunay_gap_warn_px: 120.0

subpixel:                    # PREC-01..05
  # Chosen by measurement (scripts/verify_subpixel.py, real OHRC, (0.37, -0.62),
  # 10 windows, sensor-realistic noise): ncc_gaussian_iter has the best WORST
  # case (max 0.037 px; ecc 0.058) and cannot fail to converge the way ECC can.
  # ecc has the best median (0.016 vs 0.025). The old value, ncc_quadratic, was
  # not the name of any implemented method.
  #
  # PER-POINT REFINEMENT (refine_points), re-chosen 2026-09-26 for audit C-02 on the DEV set
  # of docs/refinement_geometry_protocol.md (known warp on real TMC-2 / OHRC texture). The
  # old setting (axis-aligned patches, ncc_gaussian_iter, 33 px, 1.5 px) was worse than NO
  # refinement in 11/15 cases, p95 up to 1.39 px. Now: the source patch is resampled through
  # the model's local Jacobian, LSM (ECC affine) is tried and warped NCC after it, and a move
  # is applied only if it RAISES the Lanczos-scored NCC. Dev: 15/15 cases better than
  # unrefined at p50 and p95, worst p95 0.172 px (cap 0.75; 0.145 at cap 1.5). Variants measured (dev): no gate 0.137-0.26,
  # bilinear-scored gate 0.248 (the gate's own interpolation bias), 33 px patch 0.26-0.35.
  method: lsm                # lsm|ncc_parabola|ncc_gaussian|ncc_gaussian_iter|phase|phase_iter|corner|ecc
  fallbacks: [ncc_gaussian_iter]   # also tried per point; the best-scoring accepted move wins
  refine_half_px: 20         # 41 px patches (33 px: worst dev p95 0.26-0.35)
  max_move_px: 1.5           # warped patches. Was 0.75 (audit's advice): it froze 20/25 points with 0.6-1.9 px
                             # matcher error on the held-out set (p95 0.79). Protocol amendment 1; the gate protects.
  require_score_gain: true   # a move must raise the NCC of the warped source vs the reference patch
  score_interp: lanczos      # bilinear scoring biased the gate: 14% of moves refused vs 8%
  score_border_px: 3
  lsm_gauss: 1               # ECC gaussFiltSize (3: worst dev p95 0.245; 5: 0.37)
  phase_upsample: 100
  ecc_iterations: 50
  ecc_eps: 1.0e-6

tiers:                       # CHECK-07 confidence tiers
  # The `low` row is the ACCEPT/REJECT boundary, so it is the only row derived
  # from measurement rather than guessed. Fitted by grid search over 60 runs of
  # scripts/bench_matchers.py (4 matchers x 5 illumination cases x seeds 3/11/29),
  # scoring each run against the KNOWN synthetic transform. 45 combinations
  # separated the 33 good runs from the 27 bad ones perfectly; these are the
  # centre of that feasible region, not its edge, so there is margin either side.
  #
  #   signal     threshold   lowest GOOD run   headroom
  #   inliers    8           12                4
  #   ratio      0.325       0.4286            0.104
  #   coverage   0.15        0.1719            0.022   <-- thinnest, see below
  #
  # Both signals are load-bearing and neither is redundant:
  #   - 12 bad runs (xfeat/eloftr at +90deg and opposite Sun) have 34-105 inliers
  #     and 0.28-0.52 coverage. ONLY the ratio catches them.
  #   - 2 bad runs (aliked-lightglue, seed 29) have ratio 0.50-0.52.
  #     ONLY the coverage catches them.
  # A single-signal gate leaks one family or the other. That is the whole reason
  # assess() is a conjunction (worst-of) rather than a score.
  #
  # HONEST LIMITS. These are fitted to SYNTHETIC imagery from one terrain
  # generator, 4 matchers and 5 Sun geometries. Perfect separation on 60 runs is
  # evidence for a starting point, not proof of a robust threshold. Coverage in
  # particular has only a 0.031-wide feasible window (0.1406 < c <= 0.1719) and
  # is the first value to re-derive on real Chandrayaan-2/LRO NAC pairs.
  high:   {min_inliers: 100, min_inlier_ratio: 0.50,  min_coverage: 0.60}
  medium: {min_inliers: 40,  min_inlier_ratio: 0.325, min_coverage: 0.35}
  low:    {min_inliers: 8,   min_inlier_ratio: 0.325, min_coverage: 0.15}
  # FIXED 2026-09-23: medium's min_inlier_ratio was 0.25, BELOW low's 0.325.
  # quality._tier_for checks high, then medium, then low, so a ratio of 0.30
  # was graded MEDIUM although it sits under the measured accept/reject line --
  # the one threshold here fitted from evidence never fired on this signal.
  # Medium is raised to meet low rather than low lowered, because low is the
  # measured boundary and medium is an unvalidated guess (see below). Every
  # key must now satisfy high >= medium >= low; tests/test_routing.py pins it.
  # `high` and `medium` are still UNVALIDATED guesses: the benchmark grades the
  # accept/reject decision, so it cannot say whether a MEDIUM is really medium.
  # Anything below `low`, or any failed control gate, is REJECTED (CHECK-08).

cascade:                     # MATCH-10
  # A step is feasible when the finer image spans at least this many of the
  # coarser camera's pixels. MEASURED (scripts/measure_cascade_footprint.py):
  # real OHRC matched into TMC-2 over +-2 km with MIND, 5 windows, success =
  # z >= 10 AND within 3 px of a ~220 px reference template:
  #   64 px 2/5   80 px 2/5   96 px 3/5   112 px 5/5   128-160 px 5/5
  # Measured under the WORST lighting we hold (suns ~166 deg apart), so it is
  # conservative for better-matched pairs. Routes it decides on real products:
  # OHRC->TMC-2 727 px, TMC-2->IIRS 197, OHRC->TC 495 feasible; OHRC->IIRS 37 not.
  min_footprint_px: 112
  # A dense step is refused, not guessed, when the MIND peak's z-score is below
  # this. Read by cascade.register_step_dense, which until 2026-09-23 fell back
  # to a hard-coded 10.0 because this key did not exist. Same value; now visible.
  # Source: the footprint measurement above scored success as z >= 10.
  min_z: 10.0

gates:                       # CHECK-01..06 tolerances
  null_max_inlier_ratio: 0.05      # a null test scoring above this means we are broken
  # CHECK-03 moves the source by (3, 4) px -- |s| = 5 px -- so BOTH axes are
  # tested; a pure x shift would never catch a pipeline that ignores y.
  perturbation_shift_xy: [3, 4]
  perturbation_tolerance_px: 1.5
  identity_max_rmse_px: 0.25
  identity_min_inlier_ratio: 0.9   # an image against itself should keep ~every match
  # independent_crosscheck: flag a result an independent method (RIFT2)
  # disagrees with by more than this. Measured: catches 8/12 consistently-wrong
  # accepted results, 0 false alarms on 64 correct ones (scripts/rift_crosscheck.py).
  crosscheck_flag_px: 2.0
  # C-04 (audit 2026-09-26): register_bundle runs that cross-check (RIFT2) on every result whose
  # primary matcher is another family (docs/crosscheck_protocol.md). A flag rejects (mode 12);
  # a checker with no confident answer of its own is "inconclusive" and caps the tier here.
  crosscheck: true
  crosscheck_inconclusive_cap: MEDIUM

paths:
  data_root: data
  reports: reports
  runs: runs
