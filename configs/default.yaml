# Pipeline defaults. Owner: Member A (configs/), seeded by Member B for Part 2.
# Every threshold here is a starting point to be TUNED BY THE ABLATION, not a
# tuned result. None of these numbers is a measurement.

# CHECK-10: while true, the licence gate refuses to construct any matcher on the
# benchmark_only list in regimes.yaml. Only scripts/bench_external.py sets false.
ship_mode: true

device: auto            # auto | cpu | cuda

matching:
  max_num_keypoints: 2048
  ratio_test: 0.80           # Lowe ratio; tightened adaptively on repetitive terrain
  ratio_test_repetitive: 0.70
  mutual_nn: true
  # vismatch does its own RANSAC by default; we always disable it so our
  # estimator owns the inlier mask and the scale sanity check (P2-T01).
  skip_library_ransac: true

estimate:
  method: magsac             # magsac | ransac | usac_accurate
  reproj_threshold_px: 3.0
  max_iters: 10000
  confidence: 0.9999
  min_inliers: 12
  # Failure mode #13: reject a transform whose estimated scale disagrees with
  # the GSD ratio the instrument registry predicts.
  scale_tolerance: 0.25
  # Axis-ratio tolerance, used only when both products' pixel sizes are
  # VERIFIED by two agreeing sources. Tighter than scale_tolerance because a
  # correct transform's anisotropy is fixed by pixel geometry: IIRS is 26%
  # anisotropic, so a 25% tolerance could not tell it from a square pixel.
  anisotropy_tolerance: 0.10
  # How far outside its source range an UNVERIFIED expectation must be before
  # it may reject. Set from measurement, not taste: scripts/audit_gsd.py found
  # NAC labels off by up to 2.33x, so anything tighter would reject correct
  # transforms on the strength of a label already known to be wrong.
  unverified_scale_slack: 3.0

uniformity:                  # ALIGN-04..07, the PS uniform-distribution mandate
  grid: 8                    # N x N cells
  top_k_per_cell: 6
  refill_empty_cells: true
  refill_ratio_test: 0.90    # looser threshold, local to the empty cell only
  delaunay_gap_warn_px: 120.0

subpixel:                    # PREC-01..05
  # Chosen by measurement (scripts/verify_subpixel.py, real OHRC, (0.37, -0.62),
  # 10 windows, sensor-realistic noise): ncc_gaussian_iter has the best WORST
  # case (max 0.037 px; ecc 0.058) and cannot fail to converge the way ECC can.
  # ecc has the best median (0.016 vs 0.025). The old value, ncc_quadratic, was
  # not the name of any implemented method.
  method: ncc_gaussian_iter  # ncc_parabola|ncc_gaussian|ncc_gaussian_iter|phase|phase_iter|corner|ecc
  ncc_window: 11
  phase_upsample: 100
  ecc_iterations: 50
  ecc_eps: 1.0e-6

tiers:                       # CHECK-07 confidence tiers
  # The `low` row is the ACCEPT/REJECT boundary, so it is the only row derived
  # from measurement rather than guessed. Fitted by grid search over 60 runs of
  # scripts/bench_matchers.py (4 matchers x 5 illumination cases x seeds 3/11/29),
  # scoring each run against the KNOWN synthetic transform. 45 combinations
  # separated the 33 good runs from the 27 bad ones perfectly; these are the
  # centre of that feasible region, not its edge, so there is margin either side.
  #
  #   signal     threshold   lowest GOOD run   headroom
  #   inliers    8           12                4
  #   ratio      0.325       0.4286            0.104
  #   coverage   0.15        0.1719            0.022   <-- thinnest, see below
  #
  # Both signals are load-bearing and neither is redundant:
  #   - 12 bad runs (xfeat/eloftr at +90deg and opposite Sun) have 34-105 inliers
  #     and 0.28-0.52 coverage. ONLY the ratio catches them.
  #   - 2 bad runs (aliked-lightglue, seed 29) have ratio 0.50-0.52.
  #     ONLY the coverage catches them.
  # A single-signal gate leaks one family or the other. That is the whole reason
  # assess() is a conjunction (worst-of) rather than a score.
  #
  # HONEST LIMITS. These are fitted to SYNTHETIC imagery from one terrain
  # generator, 4 matchers and 5 Sun geometries. Perfect separation on 60 runs is
  # evidence for a starting point, not proof of a robust threshold. Coverage in
  # particular has only a 0.031-wide feasible window (0.1406 < c <= 0.1719) and
  # is the first value to re-derive on real Chandrayaan-2/LRO NAC pairs.
  high:   {min_inliers: 100, min_inlier_ratio: 0.50,  min_coverage: 0.60}
  medium: {min_inliers: 40,  min_inlier_ratio: 0.325, min_coverage: 0.35}
  low:    {min_inliers: 8,   min_inlier_ratio: 0.325, min_coverage: 0.15}
  # FIXED 2026-09-23: medium's min_inlier_ratio was 0.25, BELOW low's 0.325.
  # quality._tier_for checks high, then medium, then low, so a ratio of 0.30
  # was graded MEDIUM although it sits under the measured accept/reject line --
  # the one threshold here fitted from evidence never fired on this signal.
  # Medium is raised to meet low rather than low lowered, because low is the
  # measured boundary and medium is an unvalidated guess (see below). Every
  # key must now satisfy high >= medium >= low; tests/test_routing.py pins it.
  # `high` and `medium` are still UNVALIDATED guesses: the benchmark grades the
  # accept/reject decision, so it cannot say whether a MEDIUM is really medium.
  # Anything below `low`, or any failed control gate, is REJECTED (CHECK-08).

cascade:                     # MATCH-10
  # A step is feasible when the finer image spans at least this many of the
  # coarser camera's pixels. MEASURED (scripts/measure_cascade_footprint.py):
  # real OHRC matched into TMC-2 over +-2 km with MIND, 5 windows, success =
  # z >= 10 AND within 3 px of a ~220 px reference template:
  #   64 px 2/5   80 px 2/5   96 px 3/5   112 px 5/5   128-160 px 5/5
  # Measured under the WORST lighting we hold (suns ~166 deg apart), so it is
  # conservative for better-matched pairs. Routes it decides on real products:
  # OHRC->TMC-2 727 px, TMC-2->IIRS 197, OHRC->TC 495 feasible; OHRC->IIRS 37 not.
  min_footprint_px: 112

gates:                       # CHECK-01..06 tolerances
  null_max_inlier_ratio: 0.05      # a null test scoring above this means we are broken
  # CHECK-03 moves the source by (3, 4) px -- |s| = 5 px -- so BOTH axes are
  # tested; a pure x shift would never catch a pipeline that ignores y.
  perturbation_shift_xy: [3, 4]
  perturbation_tolerance_px: 1.5
  identity_max_rmse_px: 0.25
  identity_min_inlier_ratio: 0.9   # an image against itself should keep ~every match

paths:
  data_root: data
  reports: reports
  runs: runs
