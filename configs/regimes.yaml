# Regime routing for the matcher selector (MATCH-09 / P2-T10).
#
# WHY ROUTE INSTEAD OF PICKING ONE MODEL
# The evidence is genuinely regime-dependent and does not generalise:
#   - SuperGlue-class methods won on real lunar POLAR data where SIFT/AKAZE degraded
#     (arXiv:2509.04775, the only paper benchmarking on real Chandrayaan-2 imagery).
#   - An independent 2025 SAR-optical benchmark (MultiResSAR) found classical RIFT
#     beating the best deep method at HIGH RESOLUTION.
# Neither result transfers wholesale to the other's conditions, so we route on
# measured scene conditions and let the ablation tune the thresholds.
#
# Owner: Member B. Read by matching/regime.py.

# Matcher names are vismatch model names (71 available) unless marked vendored.
#
# LICENCE NOTE: the default is deliberately NOT superpoint-lightglue, even
# though that is the best-known LightGlue pairing. LightGlue is Apache-2.0
# including weights, but the SuperPoint DETECTOR it is usually paired with is
# Magic Leap non-commercial, so the pair is not redistributable. ALIKED is
# BSD-3, so aliked-lightglue gives us the same matcher with a clean detector.
# The gate in matching/licence.py enforces this on model-name components.
default_matcher: aliked-lightglue

rules:
  # Order matters: the first rule whose conditions all hold wins.

  - regime: extreme_scale
    when:
      scale_ratio_gte: 4.0
    action: cascade          # never match directly across a big GSD gap
    reason: >
      No matcher in the literature has documented evaluation at 100x+ scale
      ratios, and two independent teams measured 0 inliers attempting direct
      OHRC<->IIRS. Route to the staged cascade (MATCH-10) instead.

  - regime: cross_modal
    when:
      cross_modality: true
    candidates: [xoftr, minima, matchanything-eloftr, rift2]
    reason: >
      Panchromatic vs hyperspectral is a nonlinear, sometimes contrast-reversing
      radiometric relationship. Candidates are BENCHMARKED, not assumed -- see
      cross_modal_candidates below.

  - regime: same_modal_polar
    when:
      any:
        delta_incidence_gte: 30.0
        incidence_gte: 70.0
    matcher: aliked-lightglue
    preprocess: [phase_congruency]
    reason: >
      Low sun / large illumination difference is where classical detectors are
      documented to degrade. Phase congruency first, learned matcher second.

  - regime: same_modal_normal
    when: {}                 # fallback
    matcher: aliked-lightglue

# ---------------------------------------------------------------------------
# Illumination representation bands (MATCH-09, feeds PREP-02/03)
# ---------------------------------------------------------------------------
# WHICH IMAGE DESCRIPTION TO MATCH ON, AS A FUNCTION OF SUN AZIMUTH DIFFERENCE.
#
# Measured, not assumed. Correlation between the two descriptions of the same
# synthetic lunar relief lit from two directions, elevation held at 30 deg,
# 5 seeds (std 0.005-0.026, so the ordering is stable):
#
#   d_az     raw        phase congruency   MIND      winner
#     0     +1.000          +1.000        +1.000     tie
#    30     +0.867          +0.705        +0.634     RAW
#    60     +0.505          +0.513        +0.186     pc
#    90     +0.010          +0.465        +0.038     pc  (12x MIND)
#   120     -0.489          +0.459        +0.183     pc
#   150     -0.855          +0.620        +0.625     tie
#   180     -0.991          +0.860        +0.975     MIND
#
# Three findings drive the bands, and two of them are counter-intuitive:
#
#  1. BELOW ~60 DEG, RAW BEATS BOTH DESCRIPTORS. Phase congruency and MIND
#     discard the intensity relationship, and when the illumination is already
#     similar that relationship is the strongest signal available. Preprocessing
#     unconditionally is worse than not preprocessing.
#  2. PHASE CONGRUENCY OWNS 60-135 DEG. This is the genuinely hard band: raw
#     collapses to zero correlation at 90 deg because lit and shadowed facets
#     swap, and only PC still describes the structure.
#  3. MIND OWNS ~150-180 DEG. An opposed sun is close to a contrast INVERSION,
#     which is exactly what MIND is invariant to; PC is merely good there.
#
# The relationship is NOT monotonic in d_azimuth -- 90 deg is the worst case,
# not 180 deg -- so a single "more difference -> more invariance" rule is wrong.
#
# STATUS: measured on SYNTHETIC hillshaded relief. It is the same in-sample trap
# as the quality-gate thresholds if it is left there, so these bands are a
# HYPOTHESIS pending validation on the real LRO NAC illumination ladder
# (9 products, incidence 2.2-81.8 deg). Do not present them as a result.
#
# Also note these correlations measure DESCRIPTION similarity, not matching
# success. A descriptor can correlate well and still yield too few
# correspondences, which is why the quality gate stays an independent check.
representation_bands:
  - max_d_azimuth_deg: 60.0
    representation: raw
    reason: below ~60 deg the intensity relationship still carries the most signal
  - max_d_azimuth_deg: 135.0
    representation: phase_congruency
    reason: lit and shadowed facets swap; only PC still describes the structure
  - max_d_azimuth_deg: 180.0
    representation: mind
    reason: an opposed sun approaches contrast inversion, which MIND is invariant to

# ---------------------------------------------------------------------------
# What the system can actually do, as a function of sun azimuth difference
# ---------------------------------------------------------------------------
# WHAT THIS REPLACED. Until MATCH-09 this was a single threshold:
#
#     unsolved_illumination:
#       min_d_azimuth_deg: 60.0
#       evidence: reports/synthetic_matcher_bench.json
#
# It was fitted on a four-matcher benchmark -- sift, xfeat, aliked-lightglue,
# eloftr -- in which all four fail above 60 deg. A pool where nothing can pass
# cannot locate where passing stops, so the band recorded where those four
# matchers stop, not where the system stops. That is the same defect this
# project has now caught three times: "beat SIFT on the illumination-shifted
# pair" (SIFT scores zero there) and "MAGSAC beats RANSAC at 70% outliers"
# (every estimator succeeds there) failed the same way.
#
# It also contradicted the representation_bands comment forty lines above,
# which states that difficulty is NOT monotonic in azimuth. A min_ threshold
# cannot express "harder in the middle than at the end"; it necessarily calls
# 180 deg at least as hard as 90.
#
# RE-DERIVED. Criterion frozen BEFORE measuring, in
# docs/unsolved_band_protocol.md; evidence reports/illumination_sweep.json.
# 600 runs = 5 matchers x 12 azimuths x 10 seeds (201-210), elevation held at
# 45 deg so azimuth difference is the only variable. A run succeeds when the
# estimator accepts it AND the transform is within 2.0 px of the known truth
# (BAD_PX, scripts/bench_matchers.py). Successes out of 10 seeds:
#
#   d_az   xoftr  minima-loftr  aliked-lightglue  eloftr  sift-nn   verdict
#     0     10/10     10/10          10/10         10/10   10/10    solved
#    30     10/10     10/10          10/10         10/10    0/10    solved
#    45     10/10     10/10          10/10         10/10    0/10    solved
#    60     10/10     10/10           8/10          9/10    0/10    solved
#    75      0/10     10/10           2/10          3/10    0/10    solved
#    90      0/10      6/10           0/10          0/10    0/10    degraded
#   105      1/10      8/10           0/10          0/10    0/10    degraded
#   120      0/10      7/10           0/10          0/10    0/10    degraded
#   135      4/10     10/10           0/10          0/10    0/10    solved
#   150     10/10     10/10           0/10          0/10    0/10    solved
#   165     10/10     10/10           0/10          0/10    0/10    solved
#   180     10/10     10/10           0/10          0/10    0/10    solved
#
# THE OLD BAND WAS WRONG IN BOTH DIRECTIONS, and the second error is the one
# that matters:
#
#  1. 60 and 75 deg were flagged unsolved and are solved (10/10).
#  2. 135-180 deg were flagged unsolved and are solved (10/10). The angle the
#     old rule treated as the worst case is one of the EASIEST. This is the
#     contrast-inversion effect representation_bands already predicted: at 180
#     deg the scene is close to a straight inversion, which MIND-style
#     descriptors are invariant to.
#  3. The genuinely hard band is 90-120 deg, where lit and shadowed facets
#     swap. minima-loftr's median error traces the U exactly: 0.16 px at 0 deg,
#     0.85 at 75, peaking at 1.44 at 90, then back down to 0.47 at 180.
#
# NOTHING MEASURED AS `unsolved`. Even in the hard band minima-loftr reaches
# 6-8 of 10 seeds, which is `degraded` under the frozen rule (>= 9/10 solved,
# >= 6/10 degraded, sources in the protocol section 7). The key keeps the name
# `unsolved_illumination` anyway: matching/regime.py and scripts/sabotage.py
# both reference it by that string, and renaming it would silently disarm the
# sabotage that checks the tests still notice when the flag stops firing.
#
# THE CONTROL BEHAVED. sift-nn scores 10/10 at 0 deg and 0/10 at every other
# azimuth -- the floor failed exactly where it was predicted to, which is what
# says the harness measures illumination rather than something else.
#
# EVERY BAND ABOVE 60 DEG IS EARNED BY minima-loftr, NOT BY THE DEFAULT.
# aliked-lightglue manages 2/10 at 75 deg and 0/10 from 90 deg up. A caller who
# runs the default in these bands does not get the behaviour the band promises,
# so regime.py attaches a note naming the matcher that earned it.
#
# HONEST WARNING FOR MATCH-03/04/05, not acted on here. 22 of the 30 confident
# wrong answers in the sweep (accepted by the quality gate, above 2 px) came
# from the default: 7/10 at 75 deg and 6/10 at 180 deg. Failing loudly is a
# nuisance; passing the gate while wrong is failure mode #12/#19. That is
# evidence for the default-matcher decision, which this experiment does not own.
#
# DEPENDENCY. minima-loftr and xoftr are licence-clean (matching/licence.py
# clears them) but are NOT yet on shippable_matchers below -- promotion is
# MATCH-03/04/05's decision. Bands here rest on minima-loftr; if its promotion
# is refused, they must be re-derived.
#
# STATUS: SYNTHETIC. Both views are re-lightings of one hillshaded height field
# under a Lambertian model, so they differ in illumination and in nothing else.
# Real pairs differ in sensor, noise and geolocation too. Still a HYPOTHESIS
# pending the real LRO NAC illumination ladder, exactly as representation_bands
# above. Do not present it as a result on real data.
#
# Bands cover only the SAMPLED azimuths. regime.py resolves an angle that falls
# between two bands by taking the WORSE of the two, a rule fixed in the
# protocol before anything was measured.
unsolved_illumination:
  evidence: reports/illumination_sweep.json
  protocol: docs/unsolved_band_protocol.md
  supersedes: reports/synthetic_matcher_bench.json
  bands:
    - d_azimuth_deg: [0.0, 75.0]
      expectation: solved
      solved_by: [minima-loftr]
      best_seeds: 10
      reason: >
        Up to 75 deg at least one licence-clean matcher meets the 2 px bar on
        every seed. The old rule called everything from 60 deg unsolved.
    - d_azimuth_deg: [90.0, 120.0]
      expectation: degraded
      solved_by: [minima-loftr]
      best_seeds: 6
      reason: >
        The real hard band: lit and shadowed facets swap, raw correlation
        collapses to +0.010 at 90 deg. Best licence-clean matcher reaches 6-8
        of 10 seeds, so it runs and often works, but is not reliable.
    - d_azimuth_deg: [135.0, 180.0]
      expectation: solved
      solved_by: [minima-loftr]
      best_seeds: 10
      reason: >
        An opposed sun approaches contrast inversion, which MIND-style
        descriptors are invariant to. 10/10 seeds. The old rule's worst case is
        one of the easiest.

# ---------------------------------------------------------------------------
# Cross-modal candidates (MATCH-06)
# ---------------------------------------------------------------------------
# DECISION: all four are kept and benchmarked on the same tier. We do NOT drop
# RIFT2 merely because vismatch ships newer learned cross-modal models. The
# research found classical RIFT competitive at high resolution, which makes it
# worth measuring; it also gives us a non-learned baseline that needs no weights
# and cannot silently regress when a checkpoint changes. If the measured results
# show RIFT2 is consistently inferior AND adds no baseline value, it comes out
# of the shipped pipeline then -- on evidence, not on recency.
cross_modal_candidates:
  xoftr:
    source: vismatch
    kind: learned
    note: cross-modal transformer (thermal/visible origin)
  minima:
    source: vismatch
    kind: learned
    note: cross-modality matching family; several variants available
  matchanything-eloftr:
    source: vismatch
    kind: learned
    note: trained for cross-modality generalisation
  rift2:
    source: vendored           # third_party/rift2, pinned SHA
    kind: classical
    note: >
      Phase-congruency descriptor, no weights, no download. Classical baseline
      for the cross-modal regime.

# ---------------------------------------------------------------------------
# Shipping candidates for the same-modality path (MATCH-03/04/05)
# ---------------------------------------------------------------------------
shippable_matchers:
  - aliked-lightglue         # ALIKED BSD-3 + LightGlue Apache-2.0; default
  - disk-lightglue
  - eloftr
  - xfeat                    # CPU-capable fallback
  - sift-lightglue
  - sift-nn                  # the documented classical floor (MATCH-01)

# Benchmark-only. Never shipped: non-commercial licences (CHECK-10 blocks them
# while ship_mode is true). Listed so the gate has an explicit denylist and so
# bench_external.py knows what to compare against.
benchmark_only_matchers:
  - superglue                  # Magic Leap, non-commercial research only
  - superpoint-lightglue       # LightGlue is clean, SuperPoint's weights are not
  - minima-superpoint-lightglue
  - r2d2                       # CC BY-NC-SA 3.0, share-alike
